name: Run tests and upload coverage

on: 
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --only-binary=:all: fastapi==0.115.8 httpx==0.28.1 mcp==2.3.0 numpy==2.3.2 pgvector==0.3.6 pydantic==2.12.0 pydantic-settings==2.7.1 pytest==8.3.4 pytest-asyncio==0.25.3 pytest-cov==6.0.0 typing-extensions==4.14.1 uvicorn==0.34.0
          pip install --only-binary=:all: --no-deps -e .

      - name: Run tests
        run: python -m pytest tests/ --cov=common_framework --cov-branch --cov-report=xml

      - name: Upload results to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: buhozurdo/ai-rag-common-framework

      - name: Upload test results to Codecov
        if: matrix.python-version == '3.11' && !cancelled()
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.4.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
