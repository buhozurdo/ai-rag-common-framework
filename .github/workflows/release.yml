name: Publish Package & GitHub Release Assets

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write  # Required for OIDC PyPI Trusted Publishing

jobs:
  build-and-publish:
    name: Build, Verify and Publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ai-rag-common-framework

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install build and verification tools
        run: |
          pip install --only-binary :all: build==1.2.2.post1 twine==6.1.0

      - name: Build reproducible distributions (.whl and .tar.gz)
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct) python -m build

      - name: Verify package metadata and rendering
        run: |
          twine check --strict dist/*

      - name: Generate SHA-256 checksums
        run: |
          cd dist && sha256sum * > checksums.sha256

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.2.1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
