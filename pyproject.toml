[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-rag-common-framework"
version = "0.1.0"
description = "A lightweight, modular, zero-bloat foundation framework for RAG, MCP servers, and modern AI workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "BuhoZurdo Team" }
]
keywords = ["rag", "mcp", "fastapi", "llm", "ai-framework", "tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
rag = [
    "pgvector>=0.3.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]
all = [
    "ai-rag-common-framework[mcp,api,rag,test]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/common_framework"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
